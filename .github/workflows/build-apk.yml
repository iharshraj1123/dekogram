name: Build Dekogram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK & SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (TMessagesProj_AppStandalone)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --stacktrace

      - name: Locate and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dekogram-Debug-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
