name: Build Dekogram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (TMessagesProj_AppStandalone)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace

      - name: Locate and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dekogram-Debug-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
