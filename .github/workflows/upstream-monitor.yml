name: Upstream Telegram Release Monitor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Query upstream tags
        id: upstream
        run: |
          LATEST_TAG=$(curl -s "https://api.github.com/repos/DrKLO/Telegram/tags?per_page=1" | jq -r '.[0].name // empty')
          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if already tracked
        id: check_tracked
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag found."
            echo "new_tag=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check open or closed issues for this tag
          SEARCH_RESULT=$(curl -s "https://api.github.com/repos/${{ github.repository }}/issues?state=all&labels=upstream-update" | jq -r ".[].title" | grep -F "$TAG" || true)
          if [ -n "$SEARCH_RESULT" ]; then
            echo "Tag $TAG is already tracked in an issue."
            echo "new_tag=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream tag detected: $TAG"
            echo "new_tag=true" >> $GITHUB_OUTPUT
          fi

      - name: Open tracking issue
        if: steps.check_tracked.outputs.new_tag == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.tag }}';
            const title = `Upstream Telegram Release Available: ${tag}`;
            const body = `An official Telegram release tag has been published:\n\n` +
                         `- **Tag**: \`${tag}\`\n` +
                         `- **Upstream Repository**: [DrKLO/Telegram](https://github.com/DrKLO/Telegram/releases/tag/${tag})\n\n` +
                         `### Merge SOP:\n` +
                         `\`\`\`bash\n` +
                         `git fetch upstream --tags\n` +
                         `git checkout -b sync-${tag}\n` +
                         `git merge ${tag}\n` +
                         `\`\`\`\n` +
                         `Check [GEMINI.md](file:///d:/ProjectsNew/appDev2/nekogramNew/GEMINI.md) for verification guidelines.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['upstream-update']
            });
